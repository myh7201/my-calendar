  .schedule-item{display:flex;gap:12px;padding:12px 4px 12px 0}

  .now-line::before{content:'';position:absolute;left:76px;right:0;top:50%;height:1px;background:#f59e0b}

  .fab{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));right:24px;width:56px;height:56px;border-radius:50%;background:#2563eb;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px -4px rgba(37,99,235,.5);transition:transform .15s ease;z-index:40;border:none;cursor:pointer}

  .dark .month-grid{border-top-color:rgba(148,163,184,.12);border-left-color:rgba(148,163,184,.12)}
  .dark .month-cell{border-right-color:rgba(148,163,184,.12);border-bottom-color:rgba(148,163,184,.12)}
  @keyframes floatIn{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
  .anim-in{animation:floatIn .35s cubic-bezier(.2,.8,.2,1) both}

  .dark .hour-row:hover{background:rgba(99,102,241,.08)}

  .fade-in{animation:floatIn .4s ease both}
  .color-swatch{width:28px;height:28px;border-radius:50%;border:none;cursor:pointer;padding:0;position:relative;transition:transform .15s ease}
  .color-swatch:hover{transform:scale(1.12)}
  .color-swatch.on{transform:scale(1.12)}
  .color-swatch.on::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid currentColor}
  .donut-chart{width:140px;height:140px;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .donut-chart::after{content:'';position:absolute;width:70px;height:70px;background:#fff;border-radius:50%}
  .dark .donut-chart::after{background:#1e293b}
  .donut-inner{position:relative;z-index:1;text-align:center}

  .day-drawer-overlay{position:fixed;inset:0;background:rgba(2,6,23,0.4);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:80;opacity:0;transition:opacity .25s ease;pointer-events:none}
  .day-drawer-overlay.open{opacity:1;pointer-events:auto}
  .day-drawer-panel{position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:24px 24px 0 0;z-index:81;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-height:85vh;display:flex;flex-direction:column;box-shadow:0 -8px 40px rgba(2,6,23,0.15)}
  .dark .day-drawer-panel{background:#1e293b}

    .month-grid{grid-template-columns:repeat(7,1fr) !important}
    .month-header{grid-template-columns:repeat(7,1fr) !important}
    .wk-cell{display:none !important}
    .month-cell{min-height:52px;padding:2px 1px !important}
    .month-cell .text-xs{font-size:11px !important}
    .month-cell .text-\[9px\]{font-size:8px !important}
    .mobile-hide-user-bar{display:none !important}
    #todayBtn{padding:6px 10px !important;font-size:12px !important}
    .view-btn{padding:4px 8px !important;font-size:11px !important}
    .desktop-only{display:none !important}
  }
  .swipe-container{position:relative;overflow:hidden;touch-action:pan-y;-webkit-user-select:none;user-select:none;will-change:transform}
  .swipe-container .month-view-wrapper{transition:transform .28s cubic-bezier(.2,.8,.2,1)}
  .swipe-container.dragging .month-view-wrapper{transition:none}
  .swipe-shadow-left::before,.swipe-shadow-right::after{content:'';position:absolute;top:0;bottom:0;width:30px;pointer-events:none;z-index:5;opacity:0;transition:opacity .15s ease}
  .swipe-shadow-left::before{left:0;background:linear-gradient(to right, rgba(99,102,241,.15), transparent)}
  .swipe-shadow-right::after{right:0;background:linear-gradient(to left, rgba(99,102,241,.15), transparent)}
  .swipe-container.can-swipe-left.swipe-shadow-left::before{opacity:1}
  .swipe-container.can-swipe-right.swipe-shadow-right::after{opacity:1}
  @keyframes monthSlideInLeft{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
  @keyframes monthSlideInRight{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}
  .month-slide-left{animation:monthSlideInLeft .28s cubic-bezier(.2,.8,.2,1)}
  .month-slide-right{animation:monthSlideInRight .28s cubic-bezier(.2,.8,.2,1)}
</style>

<body class="h-full text-ink-800 dark:text-ink-100 flex flex-col font-sans transition-colors duration-300">

<header class="glass border-b border-ink-200/70 dark:border-ink-800/70 px-3 md:px-4 py-2 md:py-3 flex flex-wrap items-center justify-between gap-2 md:gap-3 shrink-0 shadow-soft z-30">

    <div class="flex items-center space-x-2">
      <div class="p-1.5 md:p-2 bg-gradient-to-tr from-brand-500 to-fuchsia-500 text-white rounded-xl md:rounded-2xl shadow-glow"><i data-lucide="calendar-days" class="w-4 h-4 md:w-5 md:h-5"></i></div>

    </div>

      <button id="nextBtn" class="p-1.5 rounded-lg hover:bg-white dark:hover:bg-ink-700 text-ink-600 dark:text-ink-300 transition shadow-sm"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
    </div>
    <div class="flex flex-col leading-tight">
      <h2 id="currentDateTitle" class="text-sm md:text-lg font-bold tracking-tight min-w-[100px] md:min-w-[130px]">2026年 9月</h2>
      <div id="currentDateSubtitle" class="text-[9px] md:text-xs text-ink-500 font-medium min-w-[100px] md:min-w-[130px] mt-0.5 hidden md:block"></div>
    </div>
  </div>
  <div class="flex-1 max-w-xs mx-2 hidden md:block desktop-only">
    <div class="relative group">

    </div>
  </div>
  <div class="flex items-center space-x-1.5 md:space-x-3 w-full md:w-auto justify-end mt-1 md:mt-0">
    <div class="bg-ink-100/80 dark:bg-ink-800/70 p-0.5 md:p-1 rounded-xl flex space-x-0.5 md:space-x-1 text-[11px] md:text-xs font-semibold text-ink-600 dark:text-ink-300">
      <button data-view="month" class="view-btn px-2 md:px-3 py-1 md:py-1.5 rounded-lg transition">月</button>
      <button data-view="week" class="view-btn px-2 md:px-3 py-1 md:py-1.5 rounded-lg transition">週</button>
      <button data-view="day" class="view-btn px-2 md:px-3 py-1 md:py-1.5 rounded-lg transition">日</button>

  </div>

  <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400 dark:text-emerald-600"></i>

</div>
<script>
/* ============ 常數 ============ */
const CAT_KEY = 'calendar_categories_v1';
const ACTIVE_CAT_KEY = 'calendar_active_cats_v1';
const COLOR_PALETTE = ['#6366f1','#8b5cf6','#d946ef','#ec4899','#f43f5e','#f97316','#f59e0b','#eab308','#84cc16','#10b981','#14b8a6','#06b6d4','#0ea5e9','#3b82f6','#64748b'];
const DEFAULT_CATEGORIES = [
  { id:'work', name:'工作職業', color:'#6366f1' },
  { id:'personal', name:'個人生活', color:'#10b981' },
  { id:'family', name:'家庭聚會', color:'#f59e0b' },
  { id:'health', name:'健康運動', color:'#d946ef' },
  { id:'holiday', name:'節假日', color:'#f43f5e' },
  { id:'anniversary', name:'生日和紀念日', color:'#f97316' }
];
const HOLIDAY_CAT_ID = 'holiday';
const ANNIVERSARY_CAT_ID = 'anniversary';

const SOLAR_TERMS = {
  '1-5':'小寒','1-20':'大寒','2-4':'立春','2-19':'雨水','3-6':'驚蟄','3-21':'春分',
  '4-5':'清明','4-20':'穀雨','5-6':'立夏','5-21':'小滿','6-6':'芒種','6-21':'夏至',
  '7-7':'小暑','7-23':'大暑','8-8':'立秋','8-23':'處暑','9-8':'白露','9-23':'秋分',
  '10-8':'寒露','10-23':'霜降','11-7':'立冬','11-22':'小雪','12-7':'大雪','12-21':'冬至'
};
function getSolarTerm(date){ const key = `${date.getMonth()+1}-${date.getDate()}`; return SOLAR_TERMS[key] || null; }

function lunarDayToChinese(n){
  const digits = ['','一','二','三','四','五','六','七','八','九','十'];
  if(n >= 1 && n <= 10) return '初' + digits[n];
  if(n === 20) return '二十'; if(n === 30) return '三十';
  if(n > 10 && n < 20) return '十' + digits[n - 10];
  if(n > 20 && n < 30) return '廿' + digits[n - 20];
  return '';
}
function parseChineseMonth(s){
  s = String(s).replace(/月$/, '');
  const map = { '正':1,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10,'十一':11,'十二':12 };
  if(map[s] !== undefined) return map[s];
  const n = parseInt(s, 10); return isNaN(n) ? null : n;
}
function parseChineseDay(s){
  s = String(s).replace(/日$/, '');
  const n = parseInt(s, 10);
  if(!isNaN(n) && String(n) === s) return n;
  const map = {'初一':1,'初二':2,'初三':3,'初四':4,'初五':5,'初六':6,'初七':7,'初八':8,'初九':9,'初十':10,'十一':11,'十二':12,'十三':13,'十四':14,'十五':15,'十六':16,'十七':17,'十八':18,'十九':19,'二十':20,'廿一':21,'廿二':22,'廿三':23,'廿四':24,'廿五':25,'廿六':26,'廿七':27,'廿八':28,'廿九':29,'三十':30};
  return map[s] !== undefined ? map[s] : null;
}
function getLunarMonthDay(date){
  try {
    const parts = new Intl.DateTimeFormat('zh-TW-u-ca-chinese', { month:'numeric', day:'numeric' }).formatToParts(date);
    const monthPart = parts.find(p => p.type === 'month');
    const dayPart = parts.find(p => p.type === 'day');
    if(!monthPart || !dayPart) return null;
    const m = parseChineseMonth(monthPart.value);
    const d = parseChineseDay(dayPart.value);
    if(m === null || d === null) return null;
    return { month: m, day: d };
  } catch(e){ return null; }
}
const LUNAR_FESTIVALS = {'1-1':'春節','1-15':'元宵','5-5':'端午','7-7':'七夕','8-15':'中秋','9-9':'重陽','12-8':'臘八'};
function getLunarFestival(date){
  const md = getLunarMonthDay(date); if(!md) return null;
  const key = `${md.month}-${md.day}`;
  if(LUNAR_FESTIVALS[key]) return LUNAR_FESTIVALS[key];
  if(md.month === 12 && (md.day === 29 || md.day === 30)){
    const tomorrow = new Date(date); tomorrow.setDate(tomorrow.getDate()+1);
    const tmd = getLunarMonthDay(tomorrow);
    if(tmd && tmd.month === 1 && tmd.day === 1) return '除夕';
  }
  return null;
}
function getLunarInfo(date){
  const md = getLunarMonthDay(date);
  const dayChinese = md ? lunarDayToChinese(md.day) : '';
  try {
    const fmtFull = new Intl.DateTimeFormat('zh-TW-u-ca-chinese', { year: 'numeric', month: 'long', day: 'numeric' });
    return { full: fmtFull.format(date), day: dayChinese };
  } catch (e) { return { full: '', day: dayChinese }; }
}
function getWeekNumber(date){
  const startOfYear = new Date(date.getFullYear(), 0, 1);
  const days = Math.floor((date - startOfYear) / (24 * 60 * 60 * 1000));
  return Math.ceil((days + startOfYear.getDay() + 1) / 7);
}

/* ============ 狀態 ============ */
let state = {
  currentDate: new Date(), miniDate: new Date(), view: 'month', deviceMode: 'full',

/* ============ 儲存 ============ */

  try { const s = localStorage.getItem(CAT_KEY); if(s){ const arr = JSON.parse(s); if(Array.isArray(arr) && arr.length) return arr; } } catch(e){}
  return DEFAULT_CATEGORIES.map(c=>({...c}));
}
function saveCategories(){ localStorage.setItem(CAT_KEY, JSON.stringify(state.categories)); }
function loadActiveCats(){
  try { const s = localStorage.getItem(ACTIVE_CAT_KEY); if(s){ const arr = JSON.parse(s); if(Array.isArray(arr)) return arr; } } catch(e){}
  return null;
}
function saveActiveCats(){ localStorage.setItem(ACTIVE_CAT_KEY, JSON.stringify(state.activeCategories)); }
function getCat(id){ return state.categories.find(c=>c.id===id) || { id:'_unknown', name:'未分類', color:'#94a3b8' }; }

const EVT_KEY = 'calendar_events_v1';
function loadSavedEvents(){
  const saved = localStorage.getItem(EVT_KEY);
  if(saved){ try{ return JSON.parse(saved); }catch(e){ console.error(e); } }
  return [];
}

/* ============ 工具 ============ */
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function isSameDay(a,b){ return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate(); }
function formatTime(s){ return new Date(s).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',hour12:false}); }
function formatDateForInput(dt){ const p=n=>n<10?'0'+n:n; return `${dt.getFullYear()}-${p(dt.getMonth()+1)}-${p(dt.getDate())}T${p(dt.getHours())}:${p(dt.getMinutes())}`; }
function showToast(msg){
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.remove('translate-y-10','opacity-0');
  clearTimeout(t._tid);
  t._tid = setTimeout(()=>t.classList.add('translate-y-10','opacity-0'),2400);
}
window.showToast = showToast;
function getMonthGridDays(year,month){
  const first = new Date(year,month,1);
  const startDay = first.getDay();
  const daysInMonth = new Date(year,month+1,0).getDate();
  const prevDays = new Date(year,month,0).getDate();
  const days = [];
  for(let i=startDay-1;i>=0;i--) days.push({date:new Date(year,month-1,prevDays-i),isCurrentMonth:false});
  for(let i=1;i<=daysInMonth;i++) days.push({date:new Date(year,month,i),isCurrentMonth:true});
  const remaining = 42 - days.length;
  for(let i=1;i<=remaining;i++) days.push({date:new Date(year,month+1,i),isCurrentMonth:false});
  return days;
}
function getDaySubText(date){
  const term = getSolarTerm(date);
  if(term) return { text: term, type: 'term' };
  const fest = getLunarFestival(date);
  if(fest) return { text: fest, type: 'festival' };
  const lunar = getLunarInfo(date);
  if(lunar.day) return { text: lunar.day, type: 'lunar' };
  return { text: '', type: 'none' };
}
function subTextClass(type, base = 'text-[9px] leading-tight mt-0.5'){
  if(type === 'festival') return base + ' text-rose-500 dark:text-rose-400 font-semibold';
  return base + ' text-ink-400 dark:text-ink-500';
}
function hasHolidayEvent(date){
  return state.events.some(e => { if(e.category !== HOLIDAY_CAT_ID) return false; return isSameDay(new Date(e.start), date); });
}

/* ============ ICS 工具 ============ */
function formatIcsDate(dateStr, allDay) {
  const d = new Date(dateStr); const pad = n => String(n).padStart(2, '0');
  if (allDay) return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
  return `${d.getUTCFullYear()}${pad(d.getUTCMonth()+1)}${pad(d.getUTCDate())}T${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}${pad(d.getUTCSeconds())}Z`;
}
function generateIcsContent() {
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Local Calendar//ICS Export//ZH-TW','CALSCALE:GREGORIAN'];
  state.events.forEach(evt => {
    lines.push('BEGIN:VEVENT');
    lines.push(`UID:${evt.id || 'evt-' + Date.now()}@local.calendar`);
    lines.push(`DTSTAMP:${formatIcsDate(new Date().toISOString(), false)}`);
    const isAllDay = evt.allDay;
    lines.push(`DTSTART${isAllDay ? ';VALUE=DATE' : ''}:${formatIcsDate(evt.start, isAllDay)}`);
    if (evt.end) lines.push(`DTEND${isAllDay ? ';VALUE=DATE' : ''}:${formatIcsDate(evt.end, isAllDay)}`);
    lines.push(`SUMMARY:${(evt.title || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,')}`);
    if (evt.description) lines.push(`DESCRIPTION:${evt.description.replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,')}`);
    if (evt.location) lines.push(`LOCATION:${evt.location.replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,')}`);
    const cat = getCat(evt.category);
    if (cat && cat.name) lines.push(`CATEGORIES:${cat.name}`);
    lines.push('END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  return lines.join('\r\n');
}
function downloadIcs() {
  const content = generateIcsContent();
  const blob = new Blob([content], { type: 'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `calendar-export-${new Date().toISOString().slice(0,10)}.ics`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}
function parseIcsDate(dateStr, isAllDay) {
  const colonIdx = dateStr.indexOf(':');
  let cleanStr = colonIdx !== -1 ? dateStr.substring(colonIdx + 1).trim() : dateStr.trim();
  if (isAllDay || /^\d{8}$/.test(cleanStr)) {
    const y = parseInt(cleanStr.substr(0,4)), m = parseInt(cleanStr.substr(4,2)) - 1, d = parseInt(cleanStr.substr(6,2));
    return new Date(y, m, d, 0, 0, 0).toISOString();
  }
  if (cleanStr.endsWith('Z')) {
    const y = parseInt(cleanStr.substr(0,4)), mo = parseInt(cleanStr.substr(4,2)) - 1, d = parseInt(cleanStr.substr(6,2));
    const h = parseInt(cleanStr.substr(9,2)), mi = parseInt(cleanStr.substr(11,2)), s = parseInt(cleanStr.substr(13,2));
    return new Date(Date.UTC(y, mo, d, h, mi, s)).toISOString();
  } else {
    const y = parseInt(cleanStr.substr(0,4)), mo = parseInt(cleanStr.substr(4,2)) - 1, d = parseInt(cleanStr.substr(6,2));
    const h = parseInt(cleanStr.substr(9,2)), mi = parseInt(cleanStr.substr(11,2)), s = parseInt(cleanStr.substr(13,2));
    return new Date(y, mo, d, h, mi, s).toISOString();
  }
}
function parseIcsContent(text) {
  const rawLines = text.split(/\r?\n/);
  const lines = [];
  for (let i = 0; i < rawLines.length; i++) {
    const line = rawLines[i];
    if ((line.startsWith(' ') || line.startsWith('\t')) && lines.length > 0) lines[lines.length-1] += line.substring(1);
    else lines.push(line);
  }
  const events = []; let currentEvent = null;
  lines.forEach(line => {
    if (line.startsWith('BEGIN:VEVENT')) currentEvent = {};
    else if (line.startsWith('END:VEVENT')) { if (currentEvent) { events.push(currentEvent); currentEvent = null; } }
    else if (currentEvent) {
      const colonIdx = line.indexOf(':');
      if (colonIdx !== -1) {
        const keyPart = line.substring(0, colonIdx);
        const value = line.substring(colonIdx + 1).trim();
        const key = keyPart.split(';')[0].toUpperCase();
        const unescapedValue = value.replace(/\\n/g, '\n').replace(/\\,/g, ',').replace(/\\;/g, ';').replace(/\\\\/g, '\\');
        if (key === 'SUMMARY') currentEvent.title = unescapedValue;
        else if (key === 'DTSTART') { const isAllDay = keyPart.toUpperCase().includes('VALUE=DATE'); currentEvent.start = parseIcsDate(value, isAllDay); currentEvent.allDay = isAllDay; }
        else if (key === 'DTEND') { const isAllDay = keyPart.toUpperCase().includes('VALUE=DATE'); currentEvent.end = parseIcsDate(value, isAllDay); }
        else if (key === 'DESCRIPTION') currentEvent.description = unescapedValue;
        else if (key === 'LOCATION') currentEvent.location = unescapedValue;
        else if (key === 'CATEGORIES') currentEvent.categories = unescapedValue;
      }
    }
  });
  return events;
}
function formatIcsPreviewDate(evt){
  const st = new Date(evt.start);
  const wd = ['日','一','二','三','四','五','六'][st.getDay()];
  const pad = n => String(n).padStart(2,'0');
  if(evt.allDay) return `${st.getFullYear()}/${pad(st.getMonth()+1)}/${pad(st.getDate())} 週${wd} · 全天`;
  const et = new Date(evt.end);
  return `${st.getFullYear()}/${pad(st.getMonth()+1)}/${pad(st.getDate())} 週${wd} · ${pad(st.getHours())}:${pad(st.getMinutes())}`;
}
function openIcsImportPreview(icsEvents){
  state.pendingIcsEvents = icsEvents.map(evt => ({
    title: evt.title, start: evt.start, end: evt.end, allDay: !!evt.allDay,
    location: evt.location || '', description: evt.description || '',
    userCategory: evt.suggestedCategory || state.categories[0].id
  }));
  const bulkSel = document.getElementById('bulkCategorySelect');
  bulkSel.innerHTML = state.categories.map(cat => `<option value="${cat.id}">${escapeHtml(cat.name)}</option>`).join('');
  renderIcsPreviewList();
  document.getElementById('icsImportCount').textContent = `共 ${state.pendingIcsEvents.length} 個日程`;
  const modal = document.getElementById('icsImportModal');
  modal.classList.remove('hidden');
  setTimeout(() => { modal.classList.remove('opacity-0'); modal.querySelector('div').classList.remove('scale-95'); }, 10);
}
function renderIcsPreviewList(){
  const list = document.getElementById('icsPreviewList');
  if(state.pendingIcsEvents.length === 0){ list.innerHTML = '<div class="text-center py-8 text-ink-400 text-xs">沒有日程</div>'; return; }
  list.innerHTML = state.pendingIcsEvents.map((evt, idx) => {
    const cat = getCat(evt.userCategory);
    return `<div class="ics-preview-item">
      <span class="w-1 self-stretch rounded-full shrink-0" style="background:${cat.color}"></span>
      <div class="flex-1 min-w-0">
        <div class="font-bold text-sm text-ink-800 dark:text-ink-100 truncate">${escapeHtml(evt.title)}</div>
        <div class="text-[10px] text-ink-400 mt-0.5">${formatIcsPreviewDate(evt)}</div>
      </div>
      <select class="ics-cat-select px-2 py-1.5 text-xs rounded-lg border border-ink-200 dark:border-ink-700 bg-white dark:bg-ink-950" data-idx="${idx}">
        ${state.categories.map(c => `<option value="${c.id}" ${c.id === evt.userCategory ? 'selected' : ''}>${escapeHtml(c.name)}</option>`).join('')}
      </select>
    </div>`;
  }).join('');
  list.querySelectorAll('.ics-cat-select').forEach(sel => {
    sel.addEventListener('change', e => {
      const idx = parseInt(e.target.dataset.idx);
      state.pendingIcsEvents[idx].userCategory = e.target.value;
      const cat = getCat(e.target.value);
      const bar = e.target.closest('.ics-preview-item').querySelector('span');
      if(bar) bar.style.background = cat.color;
    });
  });
}
function closeIcsImportModal(){
  const m = document.getElementById('icsImportModal');
  m.classList.add('opacity-0');
  m.querySelector('div').classList.add('scale-95');
  setTimeout(() => { m.classList.add('hidden'); state.pendingIcsEvents = []; }, 200);
}
async function confirmIcsImport(){
  if(state.pendingIcsEvents.length === 0){ closeIcsImportModal(); return; }
  const count = state.pendingIcsEvents.length;
  if (window.currentUser && typeof window.saveEventToCloud === 'function') {
    for (const evt of state.pendingIcsEvents) {
      const newEvt = { id: `evt-ics-${Date.now()}-${Math.random().toString(36).substr(2,5)}`, title: evt.title, start: evt.start, end: evt.end, allDay: evt.allDay, category: evt.userCategory || state.categories[0].id, location: evt.location, description: evt.description };
      try { await window.saveEventToCloud(newEvt); } catch(e) { console.error(e); }
    }
    closeIcsImportModal(); showToast(`已匯入 ${count} 個日程到雲端`); return;
  }
  state.pendingIcsEvents.forEach(evt => {
    state.events.push({ id: `evt-ics-${Date.now()}-${Math.random().toString(36).substr(2,5)}`, title: evt.title, start: evt.start, end: evt.end, allDay: evt.allDay, category: evt.userCategory || state.categories[0].id, location: evt.location, description: evt.description });
  });
  saveEvents(); closeIcsImportModal(); renderAll(); showToast(`已成功匯入 ${count} 個日程`);
}

  const date = new Date(dateStr);
  state.drawerDate = date;
  const weekday = ['日','一','二','三','四','五','六'][date.getDay()];
  const y = date.getFullYear(), m = date.getMonth()+1, d = date.getDate();
  document.getElementById('drawerDateTitle').textContent = `${y}年${m}月${d}日 週${weekday}`;
  const lunar = getLunarInfo(date);
  const sub = getDaySubText(date);
  let lunarText = '';
  if(sub.type === 'term' || sub.type === 'festival') lunarText = sub.text;
  else if(lunar.full) lunarText = lunar.full;
  document.getElementById('drawerLunarText').textContent = lunarText;
  const dayEvents = state.events.filter(e => isSameDay(new Date(e.start), date)).sort((a,b)=>new Date(a.start)-new Date(b.start));

    content.innerHTML = `<div class="flex flex-col items-center justify-center py-10 fade-in">
      <div class="w-24 h-24 mb-5">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-full">
          <path d="M35 20 L35 50 L10 50 L10 80 L90 80 L90 50 L65 50 L65 20 Z" stroke="currentColor" stroke-width="2" fill="none" class="text-ink-400 dark:text-ink-500"/>
          <path d="M45 30 Q50 15 60 25 Q65 35 55 40 Q50 45 45 30 Z" fill="none" stroke="currentColor" stroke-width="2" class="text-ink-400 dark:text-ink-500"/>
          <line x1="60" y1="20" x2="60" y2="40" stroke="currentColor" stroke-width="1.5" class="text-ink-400 dark:text-ink-500"/>
          <circle cx="60" cy="20" r="2" fill="currentColor" class="text-ink-400 dark:text-ink-500"/>
        </svg>

      <p class="text-xs text-ink-400 mb-6">點擊「+」或長按日期建立</p>
      <button id="drawerEmptyCreateBtn" class="px-8 py-3 bg-gradient-to-tr from-brand-600 to-fuchsia-500 text-white rounded-2xl text-sm font-bold shadow-glow hover:opacity-95 transition flex items-center space-x-2">
        <i data-lucide="plus" class="w-4 h-4"></i><span>建立</span>
      </button>
    </div>`;
    lucide.createIcons();
    document.getElementById('drawerEmptyCreateBtn').addEventListener('click', () => { closeDayDetail(); setTimeout(() => openEventModal(null, date), 250); });
  } else {
    content.innerHTML = `<div class="space-y-1">
      ${dayEvents.map(evt => {
        const cat = getCat(evt.category);
        const timeStr = evt.allDay ? '全天' : `${formatTime(evt.start)} - ${formatTime(evt.end)}`;
        return `<div class="flex items-start gap-3 py-2.5 cursor-pointer rounded-xl hover:bg-ink-50 dark:hover:bg-ink-800/50 transition px-2 -mx-2" data-id="${evt.id}">
          <div class="w-14 shrink-0 text-xs text-ink-500 dark:text-ink-400 font-medium pt-0.5 text-right">${timeStr}</div>
          <div class="w-1 self-stretch rounded-full shrink-0 mt-1" style="background:${cat.color}"></div>
          <div class="flex-1 min-w-0">
            <div class="font-bold text-sm text-ink-800 dark:text-ink-100">${escapeHtml(evt.title)}</div>

          </div>
        </div>`;
      }).join('')}
    </div>`;
    lucide.createIcons();
    content.querySelectorAll('[data-id]').forEach(el => {
      el.addEventListener('click', () => {

function closeDayDetail(){
  document.getElementById('dayDrawerOverlay').classList.remove('open');
  document.getElementById('dayDrawerPanel').classList.remove('open');
  state.drawerDate = null;
}

/* ============ 分類清單 ============ */
function renderCategories(){
  const c = document.getElementById('categoryFilters');
  c.innerHTML = state.categories.map(cat=>{
    const checked = state.activeCategories.includes(cat.id);
    return `<div class="group flex items-center justify-between rounded-xl hover:bg-white/80 dark:hover:bg-ink-800/60 border border-transparent hover:border-ink-100 dark:hover:border-ink-800 transition">
      <label class="flex items-center space-x-2.5 flex-1 min-w-0 p-2 cursor-pointer">
        <input type="checkbox" data-cat="${cat.id}" ${checked?'checked':''} class="category-checkbox rounded border-ink-300 text-brand-600 focus:ring-brand-500 w-4 h-4 cursor-pointer shrink-0">
        <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background:${cat.color}"></span>
        <span class="text-xs font-medium text-ink-700 dark:text-ink-300 truncate">${escapeHtml(cat.name)}</span>
      </label>
      <div class="flex items-center opacity-0 group-hover:opacity-100 focus-within:opacity-100 transition shrink-0 mr-1">
        <button class="cat-edit-btn p-1.5 rounded-lg text-ink-300 hover:text-brand-600 hover:bg-brand-50" data-cat="${cat.id}"><i data-lucide="pencil" class="w-3.5 h-3.5 pointer-events-none"></i></button>
        <button class="cat-del-btn p-1.5 rounded-lg text-ink-300 hover:text-rose-500 hover:bg-rose-50" data-cat="${cat.id}"><i data-lucide="x" class="w-3.5 h-3.5 pointer-events-none"></i></button>
      </div>
    </div>`;
  }).join('');
  c.querySelectorAll('.category-checkbox').forEach(cb=>{
    cb.addEventListener('change', e=>{
      const id = e.target.dataset.cat;
      if(e.target.checked){ if(!state.activeCategories.includes(id)) state.activeCategories.push(id); }
      else { state.activeCategories = state.activeCategories.filter(x=>x!==id); }
      saveActiveCats(); renderMainView();
    });
  });
  c.querySelectorAll('.cat-edit-btn').forEach(btn=>{ btn.addEventListener('click', e=>{ e.preventDefault(); e.stopPropagation(); openCategoryModal(btn.dataset.cat); }); });
  c.querySelectorAll('.cat-del-btn').forEach(btn=>{ btn.addEventListener('click', e=>{ e.preventDefault(); e.stopPropagation(); deleteCategory(btn.dataset.cat); }); });
  const select = document.getElementById('eventCategory');
  const currentVal = select.value;
  select.innerHTML = state.categories.map(cat=>`<option value="${cat.id}">${escapeHtml(cat.name)}</option>`).join('');
  if(currentVal && state.categories.some(c=>c.id===currentVal)) select.value = currentVal;
  lucide.createIcons();
}
async function deleteCategory(id){
  if(state.categories.length <= 1){ showToast('至少需要保留一個分類'); return; }
  const cat = state.categories.find(c=>c.id===id); if(!cat) return;
  const count = state.events.filter(e=>e.category === id).length;
  const msg = count > 0 ? `分類「${cat.name}」下有 ${count} 個日程，刪除後將歸入其他分類，確定要刪除嗎？` : `確定要刪除分類「${cat.name}」嗎？`;
  if(!confirm(msg)) return;
  const remaining = state.categories.filter(c=>c.id !== id);
  const fallbackId = remaining[0].id;
  let moved = 0;
  state.events.forEach(e=>{ if(e.category === id){ e.category = fallbackId; moved++; } });
  if(moved){
    if (window.currentUser && typeof window.saveEventToCloud === 'function') {
      for (const e of state.events.filter(e=>e.category === fallbackId)) { try { await window.saveEventToCloud(e); } catch(err) {} }
    } else { saveEvents(); }
  }
  state.categories = remaining;
  state.activeCategories = state.activeCategories.filter(x=>x!==id);
  saveCategories(); saveActiveCats(); renderCategories(); renderAll();
  showToast(moved > 0 ? `分類已刪除，${moved} 個日程已歸入「${remaining[0].name}」` : '分類已刪除');
}
function openCategoryModal(catId = null){
  editingCategoryId = catId;
  const modal = document.getElementById('categoryModal');
  const titleEl = document.getElementById('categoryModalTitle');
  const confirmBtn = document.getElementById('confirmCategoryBtn');
  const nameInput = document.getElementById('newCatName');
  if(catId){
    const cat = state.categories.find(c=>c.id === catId); if(!cat) return;
    titleEl.textContent = '編輯分類'; confirmBtn.textContent = '儲存';
    nameInput.value = cat.name; newCatColor = cat.color;
  } else {
    titleEl.textContent = '新增分類'; confirmBtn.textContent = '新增';
    nameInput.value = ''; newCatColor = COLOR_PALETTE[Math.floor(Math.random()*COLOR_PALETTE.length)];
  }
  renderPalette();
  modal.classList.remove('hidden');
  setTimeout(()=>{ modal.classList.remove('opacity-0'); modal.querySelector('div').classList.remove('scale-95'); nameInput.focus(); nameInput.select(); },10);
}
function closeCategoryModal(){
  const m = document.getElementById('categoryModal');
  m.classList.add('opacity-0'); m.querySelector('div').classList.add('scale-95');
  setTimeout(()=>{ m.classList.add('hidden'); editingCategoryId = null; },200);
}
function renderPalette(){
  const p = document.getElementById('colorPalette');
  p.innerHTML = COLOR_PALETTE.map(c=>`<button type="button" class="color-swatch ${c===newCatColor?'on':''}" style="background:${c}; color:${c}" data-color="${c}"></button>`).join('');
  p.querySelectorAll('.color-swatch').forEach(b=>{ b.addEventListener('click', ()=>{ newCatColor = b.dataset.color; renderPalette(); }); });
}
function saveCategory(){
  const nameEl = document.getElementById('newCatName');
  const name = nameEl.value.trim();
  if(!name){ showToast('請輸入分類名稱'); nameEl.focus(); return; }

    const id = 'cat_' + Date.now().toString(36) + Math.random().toString(36).slice(2,5);

    state.activeCategories.push(id);

  }
}

function initMonthSwipe(){
  const container = document.getElementById('monthSwipeContainer'); if(!container) return;
  const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  if(!isTouchDevice) return;
  container.addEventListener('touchstart', (e) => {
    if(e.touches.length !== 1) return;
    const t = e.touches[0];
    state.swipeStartX = t.clientX; state.swipeStartY = t.clientY;
    state.swipeCurrentX = t.clientX; state.swipeCurrentY = t.clientY;
    state.swiping = false;
  }, { passive: true });
  container.addEventListener('touchmove', (e) => {
    if(e.touches.length !== 1) return;
    const t = e.touches[0];
    state.swipeCurrentX = t.clientX; state.swipeCurrentY = t.clientY;
    const dx = state.swipeCurrentX - state.swipeStartX;
    const dy = state.swipeCurrentY - state.swipeStartY;
    if(Math.abs(dy) > Math.abs(dx)) return;
    if(Math.abs(dx) > 8) {
      state.swiping = true;
      container.classList.add('dragging');
      container.classList.remove('can-swipe-left', 'can-swipe-right');
      if(dx > 30) container.classList.add('can-swipe-right');
      else if(dx < -30) container.classList.add('can-swipe-left');
    }
  }, { passive: true });
  container.addEventListener('touchend', () => {
    container.classList.remove('dragging', 'can-swipe-left', 'can-swipe-right');
    if(!state.swiping){ state.swiping = false; return; }
    const dx = state.swipeCurrentX - state.swipeStartX;
    const dy = state.swipeCurrentY - state.swipeStartY;
    if(Math.abs(dy) > Math.abs(dx)){ state.swiping = false; return; }
    if(Math.abs(dx) >= state.swipeThreshold){ if(dx < 0) goToNextMonth(); else goToPrevMonth(); }
    state.swiping = false;
  }, { passive: true });
  container.addEventListener('touchcancel', () => {
    container.classList.remove('dragging', 'can-swipe-left', 'can-swipe-right');
    state.swiping = false;
  }, { passive: true });
}

        <div class="flex items-center space-x-3"><div class="w-10 h-10 rounded-xl bg-rose-50 dark:bg-rose-950/40 flex items-center justify-center"><i data-lucide="file-pen" class="w-5 h-5 text-rose-500"></i></div><div><div class="text-[10px] text-ink-400 font-semibold">總備忘錄數</div><div class="text-xl font-extrabold tabular-nums">0</div></div></div>

      <h3 class="text-sm font-bold text-ink-700 dark:text-ink-200 mb-4 flex items-center justify-between"><span>事件&行事曆分類</span><span class="text-[10px] text-ink-400 font-normal">所有</span></h3>

        <div class="flex-1 space-y-2">
          ${catData.length > 0 ? catData.map(cat => `<div class="flex items-center justify-between text-xs"><div class="flex items-center space-x-2"><span class="w-3 h-3 rounded-sm" style="background:${cat.color}"></span><span class="font-medium text-ink-700 dark:text-ink-300">${escapeHtml(cat.name)}</span></div><span class="font-semibold tabular-nums text-ink-500">${cat.count}</span></div>`).join('') : '<div class="text-xs text-ink-400">暫無分類數據</div>'}
        </div>
      </div>
    </div>
    <div class="bg-white dark:bg-ink-900 rounded-2xl border border-ink-200/70 dark:border-ink-800/70 p-5 mb-5 shadow-soft">
      <h3 class="text-sm font-bold text-ink-700 dark:text-ink-200 mb-4 flex items-center justify-between"><span>近期生日和紀念日</span><span class="text-[10px] text-ink-400 font-normal">所有</span></h3>
      <div class="space-y-4">
        ${anniversaries.length > 0 ? anniversaries.map(a => { const displayDays = a.diffDays === 0 ? '今天' : `${a.diffDays} D`; return `<div class="flex items-center justify-between"><div><div class="font-bold text-sm text-ink-800 dark:text-ink-100">${escapeHtml(a.title)}</div><div class="text-[10px] text-ink-400 mt-0.5">${formatAnnDate(a.date)}</div></div><div class="text-base font-extrabold tabular-nums ${a.diffDays === 0 ? 'text-rose-500' : 'text-ink-800 dark:text-ink-100'}">${displayDays}</div></div>`; }).join('') : '<div class="text-xs text-ink-400 text-center py-4">暫無生日或紀念日</div>'}
      </div>
    </div>
    <button id="backToCalendarBtn" class="w-full py-3 rounded-2xl bg-ink-100 dark:bg-ink-800 text-ink-600 dark:text-ink-300 text-sm font-semibold hover:bg-ink-200 dark:hover:bg-ink-700 transition mb-4">返回日曆</button>
  </div>`;
  c.innerHTML = html;
  lucide.createIcons();
  document.getElementById('backToCalendarBtn').addEventListener('click', () => { state.view = 'month'; renderAll(); });
}

/* ============ 渲染路由 ============ */
function renderMainView(animationDir){
  if(state.view === 'my'){ document.getElementById('sidebar').classList.add('hidden'); renderMyView(); return; }
  else {
    const sidebar = document.getElementById('sidebar');
    if(window.innerWidth >= 768) sidebar.classList.remove('hidden');
    else sidebar.classList.add('hidden');
  }
  if(state.view==='month') {
    renderMonthView();
    if(animationDir === 'left' || animationDir === 'right'){
      const wrapper = document.querySelector('.month-view-wrapper');
      if(wrapper){
        wrapper.classList.add(animationDir === 'left' ? 'month-slide-left' : 'month-slide-right');
        setTimeout(() => { wrapper.classList.remove('month-slide-left', 'month-slide-right'); }, 300);
      }
    }
  }
  else if(state.view==='week') renderWeekView();
  else if(state.view==='day') renderDayView();
  else if(state.view==='schedule') renderScheduleView();
  const fab = document.getElementById('fabAddBtn');
  if(state.view === 'schedule') fab.classList.remove('hidden');
  else fab.classList.add('hidden');
  lucide.createIcons();
  bindDynamicEvents();
}
window.renderMainView = renderMainView;

function updateHeaderInfo(){
  const d = state.currentDate;
  const y = d.getFullYear(), m = d.getMonth()+1;
  document.getElementById('currentDateTitle').textContent = `${y}年 ${m}月`;
  const lunar = getLunarInfo(d);
  const weekNum = getWeekNumber(d);
  const weekday = ['日','一','二','三','四','五','六'][d.getDay()];
  let subtitle = `${m}月${d.getDate()}日 週${weekday}`;
  if(lunar.full) subtitle += ` · ${lunar.full}`;
  subtitle += ` · 第${weekNum}週`;
  document.getElementById('currentDateSubtitle').textContent = subtitle;
}
function renderAll(){
  updateHeaderInfo();
  document.querySelectorAll('.view-btn').forEach(btn=>{
    if(btn.dataset.view===state.view) btn.className = 'view-btn px-2 md:px-3 py-1 md:py-1.5 rounded-lg transition bg-white dark:bg-ink-700 text-brand-600 dark:text-brand-300 shadow-sm font-bold';
    else btn.className = 'view-btn px-2 md:px-3 py-1 md:py-1.5 rounded-lg transition hover:text-ink-900 dark:hover:text-white';
  });
  renderMiniCalendar(); renderStats(); renderMainView();
}
window.renderAll = renderAll;

function openEventModal(eventObj=null, defaultDate=null){
  const modal = document.getElementById('eventModal');
  const form = document.getElementById('eventForm');
  const delBtn = document.getElementById('deleteEventBtn');
  const title = document.getElementById('modalTitle');
  if(eventObj){
    title.textContent = '編輯日程';
    document.getElementById('eventId').value = eventObj.id;
    document.getElementById('eventTitle').value = eventObj.title;
    document.getElementById('eventStart').value = formatDateForInput(new Date(eventObj.start));
    document.getElementById('eventEnd').value = formatDateForInput(new Date(eventObj.end));
    document.getElementById('eventAllDay').checked = eventObj.allDay;
    document.getElementById('eventCategory').value = eventObj.category;
    document.getElementById('eventLocation').value = eventObj.location || '';
    document.getElementById('eventDescription').value = eventObj.description || '';
    delBtn.classList.remove('hidden');
  } else {
    title.textContent = '新建日程';
    form.reset();
    document.getElementById('eventId').value = '';
    const s = defaultDate ? new Date(defaultDate) : new Date(state.currentDate);
    s.setHours(9,0,0,0);
    const e = new Date(s); e.setHours(10,0,0,0);
    document.getElementById('eventStart').value = formatDateForInput(s);
    document.getElementById('eventEnd').value = formatDateForInput(e);
    delBtn.classList.add('hidden');
  }
  modal.classList.remove('hidden');
  setTimeout(()=>{ modal.classList.remove('opacity-0'); modal.querySelector('div').classList.remove('scale-95'); },10);
}
function closeEventModal(){
  const modal = document.getElementById('eventModal');
  modal.classList.add('opacity-0');
  modal.querySelector('div').classList.add('scale-95');
  setTimeout(()=>modal.classList.add('hidden'),200);
}
function bindDynamicEvents(){
  document.querySelectorAll('.cell-day').forEach(cell=>{
    cell.addEventListener('click', e=>{
      if(e.target.closest('.month-event-block')) return;
      if(state.swiping) return;
      openDayDetail(cell.dataset.date);
    });
  });
  document.querySelectorAll('.cell-hour').forEach(cell=>{
    cell.addEventListener('click', e=>{
      if(e.target.closest('.event-pill')) return;
      const d = new Date(cell.dataset.date);
      d.setHours(parseInt(cell.dataset.hour));
      openDayDetail(d.toISOString());
    });
  });
  document.querySelectorAll('.event-pill, .schedule-card, .month-event-block').forEach(p=>{
    p.addEventListener('click', e=>{
      e.stopPropagation();
      const evt = state.events.find(x=>x.id===p.dataset.id);
      if(evt) openEventModal(evt);
    });
  });
  document.querySelectorAll('.empty-day').forEach(el=>{
    el.addEventListener('click', ()=>{ openDayDetail(el.dataset.date); });
  });
}
function setDeviceMode(mode){
  state.deviceMode = mode;
  const vp = document.getElementById('appViewport');
  const sidebar = document.getElementById('sidebar');
  vp.className = 'flex-1 flex overflow-hidden relative transition-all duration-300';
  document.querySelectorAll('.device-btn').forEach(btn=>{
    if(btn.dataset.device===mode) btn.className = 'device-btn p-1.5 rounded-lg text-brand-600 dark:text-brand-400 bg-brand-50 dark:bg-brand-900/40';
    else btn.className = 'device-btn p-1.5 rounded-lg text-ink-500 dark:text-ink-400 hover:bg-ink-100 dark:hover:bg-ink-700';
  });
  if(mode==='mobile'){ vp.classList.add('device-mobile'); sidebar.classList.add('hidden'); }
  else if(mode==='tablet'){ vp.classList.add('device-tablet'); sidebar.classList.remove('hidden'); }
  else { sidebar.classList.remove('hidden'); }
  renderMainView();
}
function initEventListeners(){
  document.getElementById('todayBtn').addEventListener('click',()=>{ state.currentDate = new Date(); state.miniDate = new Date(); renderAll(); });
  document.getElementById('prevBtn').addEventListener('click',()=>{
    if(state.view==='month') state.currentDate.setMonth(state.currentDate.getMonth()-1);
    else if(state.view==='week') state.currentDate.setDate(state.currentDate.getDate()-7);
    else state.currentDate.setDate(state.currentDate.getDate()-1);
    renderAll();
  });
  document.getElementById('nextBtn').addEventListener('click',()=>{
    if(state.view==='month') state.currentDate.setMonth(state.currentDate.getMonth()+1);
    else if(state.view==='week') state.currentDate.setDate(state.currentDate.getDate()+7);
    else state.currentDate.setDate(state.currentDate.getDate()+1);
    renderAll();
  });
  document.getElementById('miniPrevBtn').addEventListener('click',()=>{ state.miniDate.setMonth(state.miniDate.getMonth()-1); renderMiniCalendar(); });
  document.getElementById('miniNextBtn').addEventListener('click',()=>{ state.miniDate.setMonth(state.miniDate.getMonth()+1); renderMiniCalendar(); });
  document.querySelectorAll('.view-btn').forEach(btn=>{ btn.addEventListener('click',()=>{ state.view = btn.dataset.view; renderAll(); }); });
  document.querySelectorAll('.device-btn').forEach(btn=>{ btn.addEventListener('click',()=>setDeviceMode(btn.dataset.device)); });
  document.getElementById('addEventBtn').addEventListener('click',()=>openEventModal());
  document.getElementById('closeModalBtn').addEventListener('click',closeEventModal);
  document.getElementById('cancelModalBtn').addEventListener('click',closeEventModal);
  document.getElementById('fabAddBtn').addEventListener('click',()=>openEventModal(null, state.currentDate));
  document.getElementById('myPageBtn').addEventListener('click', () => { state.view = 'my'; renderAll(); });
  document.getElementById('addCategoryBtn').addEventListener('click', ()=>openCategoryModal(null));
  document.getElementById('closeCategoryModalBtn').addEventListener('click', closeCategoryModal);
  document.getElementById('cancelCategoryBtn').addEventListener('click', closeCategoryModal);
  document.getElementById('confirmCategoryBtn').addEventListener('click', saveCategory);
  document.getElementById('newCatName').addEventListener('keydown', e=>{ if(e.key === 'Enter'){ e.preventDefault(); saveCategory(); } });

  document.getElementById('eventForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const id = document.getElementById('eventId').value || `evt-${Date.now()}`;
    const evt = {
      id, title: document.getElementById('eventTitle').value,
      start: document.getElementById('eventStart').value, end: document.getElementById('eventEnd').value,
      allDay: document.getElementById('eventAllDay').checked, category: document.getElementById('eventCategory').value,
      location: document.getElementById('eventLocation').value, description: document.getElementById('eventDescription').value
    };
    if (window.currentUser && typeof window.saveEventToCloud === 'function') {
      try {
        await window.saveEventToCloud(evt); showToast('已同步至雲端'); closeEventModal();
      } catch (err) {
        console.error('雲端儲存失敗:', err); showToast('雲端儲存失敗，已儲存到本地');
        const idx = state.events.findIndex(x=>x.id===id);
        if(idx>=0){ state.events[idx] = evt; } else { state.events.push(evt); }
        saveEvents(); closeEventModal(); renderAll();
      }
    } else {
      const idx = state.events.findIndex(x=>x.id===id);
      if(idx>=0){ state.events[idx] = evt; showToast('日程已更新'); }
      else { state.events.push(evt); showToast('已新增日程'); }
      saveEvents(); closeEventModal(); renderAll();
    }
  });

  document.getElementById('deleteEventBtn').addEventListener('click', async ()=>{
    const id = document.getElementById('eventId').value;
    if(!id) return;
    if (window.currentUser && typeof window.deleteEventFromCloud === 'function') {
      try { await window.deleteEventFromCloud(id); showToast('日程已從雲端刪除'); closeEventModal(); }
      catch (err) {
        console.error('雲端刪除失敗:', err); showToast('雲端刪除失敗，已從本地移除');
        state.events = state.events.filter(x=>x.id!==id); saveEvents(); closeEventModal(); renderAll();
      }
    } else {
      state.events = state.events.filter(x=>x.id!==id);
      saveEvents(); showToast('日程已刪除'); closeEventModal(); renderAll();
    }
  });

  const handleSearch = e=>{ state.searchQuery = e.target.value; renderMainView(); };
  document.getElementById('searchInput').addEventListener('input',handleSearch);
  document.getElementById('mobileSearchInput').addEventListener('input',handleSearch);
  document.getElementById('themeToggleBtn').addEventListener('click',()=>{ document.documentElement.classList.toggle('dark'); });

  const dataModal = document.getElementById('dataModal');
  document.getElementById('dataBtn').addEventListener('click',()=>dataModal.classList.remove('hidden'));
  document.getElementById('closeDataModalBtn').addEventListener('click',()=>dataModal.classList.add('hidden'));

  document.getElementById('exportJsonBtn').addEventListener('click',()=>{
    const payload = { version: 1, exportedAt: new Date().toISOString(), categories: state.categories, events: state.events };
    const dataStr = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(payload, null, 2));
    const a = document.createElement('a');
    a.setAttribute('href',dataStr);
    a.setAttribute('download',`calendar-backup-${new Date().toISOString().slice(0,10)}.json`);
    a.click();
    showToast('已匯出 JSON 備份檔');
  });
  document.getElementById('exportIcsBtn').addEventListener('click', () => {
    if (state.events.length === 0) { showToast('沒有日程可以匯出'); return; }
    downloadIcs(); showToast('已匯出 ICS 檔案');
  });

  document.getElementById('importJsonInput').addEventListener('change', async e=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = async evt=>{
      try{
        const data = JSON.parse(evt.target.result);
        let importedEvents = [];
        if(data && Array.isArray(data.categories) && Array.isArray(data.events)){ state.categories = data.categories; importedEvents = data.events; }
        else if(Array.isArray(data)){ importedEvents = data; }
        else throw new Error('格式錯誤');
        if (window.currentUser && typeof window.saveEventToCloud === 'function') {
          for (const evt of importedEvents) { try { await window.saveEventToCloud(evt); } catch(err) {} }
          showToast(`已匯入 ${importedEvents.length} 個日程到雲端`);
        } else {
          state.events = importedEvents; saveEvents(); renderAll(); showToast('已成功匯入 JSON');
        }
        state.activeCategories = state.activeCategories.filter(id => state.categories.some(c=>c.id === id));
        if(state.activeCategories.length === 0) state.activeCategories = state.categories.map(c=>c.id);
        saveCategories(); saveActiveCats(); renderCategories(); dataModal.classList.add('hidden');
      }catch(err){ alert('JSON 格式不正確：' + err.message); }
    };
    reader.readAsText(file); e.target.value = '';
  });

  document.getElementById('importIcsInput').addEventListener('change', e => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = evt => {
      try {
        const icsEvents = parseIcsContent(evt.target.result);
        if (icsEvents.length === 0) { showToast('沒有找到可匯入的事件'); return; }
        const prepared = icsEvents.map(icsEvt => {
          if (!icsEvt.title || !icsEvt.start) return null;
          let end = icsEvt.end;
          if (!end) { const startDate = new Date(icsEvt.start); startDate.setHours(startDate.getHours() + 1); end = startDate.toISOString(); }
          let suggestedCategory = state.categories[0].id;
          if (icsEvt.categories) {
            const matched = state.categories.find(c => icsEvt.categories.includes(c.name) || c.name.includes(icsEvt.categories));
            if (matched) suggestedCategory = matched.id;
          }
          return { title: icsEvt.title, start: icsEvt.start, end: end, allDay: !!icsEvt.allDay, location: icsEvt.location || '', description: icsEvt.description || '', suggestedCategory };
        }).filter(Boolean);
        if (prepared.length === 0) { showToast('沒有有效的日程可匯入'); return; }
        dataModal.classList.add('hidden'); openIcsImportPreview(prepared);
      } catch (err) { alert('ICS 檔案解析失敗：' + err.message); }
    };
    reader.readAsText(file); e.target.value = '';
  });

  document.getElementById('closeIcsImportBtn').addEventListener('click', closeIcsImportModal);
  document.getElementById('cancelIcsImport').addEventListener('click', closeIcsImportModal);
  document.getElementById('confirmIcsImport').addEventListener('click', confirmIcsImport);
  document.getElementById('applyBulkCategory').addEventListener('click', () => {
    const bulkId = document.getElementById('bulkCategorySelect').value;
    state.pendingIcsEvents.forEach(evt => { evt.userCategory = bulkId; });
    renderIcsPreviewList(); showToast('已套用至全部日程');
  });

  document.getElementById('resetDemoBtn').addEventListener('click', async ()=>{
    if(!confirm('確定要清空所有日程嗎？此操作無法復原。分類會保留。')) return;
    if (window.currentUser && typeof window.deleteEventFromCloud === 'function') {
      const ids = state.events.map(e => e.id);
      for (const id of ids) { try { await window.deleteEventFromCloud(id); } catch(err) {} }
      showToast('已清空雲端所有日程');
    } else {
      state.events = []; saveEvents(); renderAll(); showToast('已清空所有日程');
    }
    dataModal.classList.add('hidden');
  });

  document.getElementById('drawerCloseIconBtn').addEventListener('click', closeDayDetail);
  document.getElementById('dayDrawerOverlay').addEventListener('click', closeDayDetail);
  document.getElementById('drawerAddIconBtn').addEventListener('click', () => {
    const date = state.drawerDate || state.currentDate;
    closeDayDetail();
    setTimeout(() => openEventModal(null, date), 250);
  });
}

window.onload = function(){
  state.categories = loadCategories();
  const savedActive = loadActiveCats();
  const allIds = state.categories.map(c=>c.id);
  state.activeCategories = (savedActive || allIds).filter(id => state.categories.some(c=>c.id === id));
  state.events = loadSavedEvents();
  renderCategories();
  initEventListeners();
  renderAll();
  lucide.createIcons();
};
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
  import { getFirestore, collection, doc, setDoc, getDocs, onSnapshot, query, where, deleteDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

  const firebaseConfig = window.FIREBASE_CONFIG;
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const googleProvider = new GoogleAuthProvider();

  let currentUser = null;
  let unsubscribeEvents = null;
  let hasMigratedLocal = false;
  window.currentUser = null;

  window.signInWithGoogle = async function() {
    try { await signInWithPopup(auth, googleProvider); }
    catch (error) { console.error("登入失敗:", error); alert("登入失敗：" + error.message); }
  };
  window.signOutUser = async function() {
    try { await signOut(auth); } catch (error) { console.error("登出失敗:", error); }
  };

  onAuthStateChanged(auth, async (user) => {
    currentUser = user;
    window.currentUser = user;
    if (user) {
      console.log("已登入:", user.displayName, user.email);
      updateLoginUI(user);
      if (!hasMigratedLocal) {
        try {
          const q = query(collection(db, "events"), where("userId", "==", user.uid));
          const snapshot = await getDocs(q);
          const localEvents = (window.state && window.state.events) || [];
          if (snapshot.empty && localEvents.length > 0) {
            for (const evt of localEvents) {
              const ref = doc(db, "events", evt.id);
              await setDoc(ref, { ...evt, userId: user.uid });
            }
          }
          hasMigratedLocal = true;
        } catch (e) { console.error("遷移失敗:", e); }
      }
      startListeningToEvents();
      updateStorageHint(true);
    } else {
      updateLoginUI(null);
      if (unsubscribeEvents) { unsubscribeEvents(); unsubscribeEvents = null; }
      if (window.state) {
        const saved = localStorage.getItem('calendar_events_v1');
        try { window.state.events = saved ? JSON.parse(saved) : []; } catch(e) { window.state.events = []; }
        if (typeof window.renderAll === 'function') window.renderAll();
      }
      updateStorageHint(false);
    }
  });

  function startListeningToEvents() {
    if (!currentUser) return;
    if (unsubscribeEvents) unsubscribeEvents();
    const q = query(collection(db, "events"), where("userId", "==", currentUser.uid));
    unsubscribeEvents = onSnapshot(q, (snapshot) => {
      const cloudEvents = [];
      snapshot.forEach((d) => {
        const data = d.data();
        const { userId, ...evt } = data;
        cloudEvents.push({ id: d.id, ...evt });
      });
      if (window.state) {
        window.state.events = cloudEvents;
        try { localStorage.setItem('calendar_events_v1', JSON.stringify(cloudEvents)); } catch(e) {}
        if (typeof window.renderAll === 'function') window.renderAll();
      }
    }, (error) => { console.error("監聽失敗:", error); });
  }

  window.saveEventToCloud = async function(event) {
    if (!currentUser) throw new Error("未登入");
    const ref = doc(db, "events", event.id);
    await setDoc(ref, { ...event, userId: currentUser.uid });
  };
  window.deleteEventFromCloud = async function(eventId) {
    if (!currentUser) throw new Error("未登入");
    await deleteDoc(doc(db, "events", eventId));
  };

  function updateLoginUI(user) {
    const loginBtn = document.getElementById('loginBtn');
    const userInfo = document.getElementById('userInfo');
    const userName = document.getElementById('userName');
    const userAvatar = document.getElementById('userAvatar');
    const sideAvatar = document.getElementById('sideAvatar');
    const sideAvatarPlaceholder = document.getElementById('sideAvatarPlaceholder');
    const sideUserName = document.getElementById('sideUserName');
    const sideUserSub = document.getElementById('sideUserSub');
    if (user) {
      if (loginBtn) loginBtn.classList.add('hidden');
      if (userInfo) { userInfo.classList.remove('hidden'); userInfo.classList.add('flex'); }
      if (userName) userName.textContent = user.displayName || user.email || '使用者';
      if (userAvatar && user.photoURL) userAvatar.src = user.photoURL;
      if (sideAvatar && user.photoURL) { sideAvatar.src = user.photoURL; sideAvatar.classList.remove('hidden'); if (sideAvatarPlaceholder) sideAvatarPlaceholder.classList.add('hidden'); }
      if (sideUserName) sideUserName.textContent = user.displayName || '使用者';
      if (sideUserSub) sideUserSub.textContent = user.email || '';
    } else {
      if (loginBtn) loginBtn.classList.remove('hidden');
      if (userInfo) { userInfo.classList.add('hidden'); userInfo.classList.remove('flex'); }
      if (sideAvatar) sideAvatar.classList.add('hidden');
      if (sideAvatarPlaceholder) sideAvatarPlaceholder.classList.remove('hidden');
      if (sideUserName) sideUserName.textContent = '本地使用者';
      if (sideUserSub) sideUserSub.textContent = '資料僅存於此裝置';
    }
  }
  function updateStorageHint(isLoggedIn) {
    const hint = document.getElementById('storageHint');
    if (!hint) return;
    if (isLoggedIn) hint.textContent = '已登入，資料會自動同步到雲端。任何裝置用同一個帳號登入都能看到相同日程。';
    else hint.textContent = '資料儲存在此瀏覽器本地。點擊右上角「Google 登入」即可跨裝置同步。';
  }
  updateStorageHint(false);
</script>
</body>
</html>
