<script>
const CAT_KEY='calendar_categories_v1',ACTIVE_CAT_KEY='calendar_active_cats_v1';
const COLOR_PALETTE=['#6366f1','#8b5cf6','#d946ef','#ec4899','#f43f5e','#f97316','#f59e0b','#eab308','#84cc16','#10b981','#14b8a6','#06b6d4','#0ea5e9','#3b82f6','#64748b'];
const DEFAULT_CATEGORIES=[{id:'work',name:'工作職業',color:'#6366f1'},{id:'personal',name:'個人生活',color:'#10b981'},{id:'family',name:'家庭聚會',color:'#f59e0b'},{id:'health',name:'健康運動',color:'#d946ef'},{id:'holiday',name:'節假日',color:'#f43f5e'},{id:'anniversary',name:'生日和紀念日',color:'#f97316'}];
const HOLIDAY_CAT_ID='holiday',ANNIVERSARY_CAT_ID='anniversary';
const SOLAR_TERMS={'1-5':'小寒','1-20':'大寒','2-4':'立春','2-19':'雨水','3-6':'驚蟄','3-21':'春分','4-5':'清明','4-20':'穀雨','5-6':'立夏','5-21':'小滿','6-6':'芒種','6-21':'夏至','7-7':'小暑','7-23':'大暑','8-8':'立秋','8-23':'處暑','9-8':'白露','9-23':'秋分','10-8':'寒露','10-23':'霜降','11-7':'立冬','11-22':'小雪','12-7':'大雪','12-21':'冬至'};
const LUNAR_FESTIVALS={'1-1':'春節','1-15':'元宵','5-5':'端午','7-7':'七夕','8-15':'中秋','9-9':'重陽','12-8':'臘八'};
function getSolarTerm(d){return SOLAR_TERMS[`${d.getMonth()+1}-${d.getDate()}`]||null}
function lunarDayToChinese(n){const g=['','一','二','三','四','五','六','七','八','九','十'];if(n>=1&&n<=10)return'初'+g[n];if(n===20)return'二十';if(n===30)return'三十';if(n>10&&n<20)return'十'+g[n-10];if(n>20&&n<30)return'廿'+g[n-20];return''}
function parseChineseMonth(s){s=String(s).replace(/月$/,'');const m={'正':1,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10,'十一':11,'十二':12};if(m[s]!==undefined)return m[s];const n=parseInt(s,10);return isNaN(n)?null:n}
function parseChineseDay(s){s=String(s).replace(/日$/,'');const n=parseInt(s,10);if(!isNaN(n)&&String(n)===s)return n;const m={'初一':1,'初二':2,'初三':3,'初四':4,'初五':5,'初六':6,'初七':7,'初八':8,'初九':9,'初十':10,'十一':11,'十二':12,'十三':13,'十四':14,'十五':15,'十六':16,'十七':17,'十八':18,'十九':19,'二十':20,'廿一':21,'廿二':22,'廿三':23,'廿四':24,'廿五':25,'廿六':26,'廿七':27,'廿八':28,'廿九':29,'三十':30};return m[s]!==undefined?m[s]:null}
function getLunarMonthDay(d){try{const p=new Intl.DateTimeFormat('zh-TW-u-ca-chinese',{month:'numeric',day:'numeric'}).formatToParts(d);const mp=p.find(x=>x.type==='month'),dp=p.find(x=>x.type==='day');if(!mp||!dp)return null;const m=parseChineseMonth(mp.value),day=parseChineseDay(dp.value);if(m===null||day===null)return null;return{month:m,day}}catch(e){return null}}
function getLunarFestival(d){const md=getLunarMonthDay(d);if(!md)return null;const k=`${md.month}-${md.day}`;if(LUNAR_FESTIVALS[k])return LUNAR_FESTIVALS[k];if(md.month===12&&(md.day===29||md.day===30)){const t=new Date(d);t.setDate(t.getDate()+1);const tm=getLunarMonthDay(t);if(tm&&tm.month===1&&tm.day===1)return'除夕'}return null}
function getLunarInfo(d){const md=getLunarMonthDay(d);const dc=md?lunarDayToChinese(md.day):'';try{const ff=new Intl.DateTimeFormat('zh-TW-u-ca-chinese',{year:'numeric',month:'long',day:'numeric'});return{full:ff.format(d),day:dc}}catch(e){return{full:'',day:dc}}}
function getWeekNumber(d){const s=new Date(d.getFullYear(),0,1);const days=Math.floor((d-s)/86400000);return Math.ceil((days+s.getDay()+1)/7)}
let state={currentDate:new Date(),miniDate:new Date(),view:'month',categories:[],activeCategories:[],searchQuery:'',events:[],drawerDate:null,swipeStartX:0,swipeStartY:0,swipeCurrentX:0,swipeCurrentY:0,swiping:false,swipeThreshold:60};
window.state=state;
let editingCategoryId=null,newCatColor=COLOR_PALETTE[0];
function loadCategories(){try{const s=localStorage.getItem(CAT_KEY);if(s){const a=JSON.parse(s);if(Array.isArray(a)&&a.length)return a}}catch(e){}return DEFAULT_CATEGORIES.map(c=>({...c}))}
function saveCategories(){localStorage.setItem(CAT_KEY,JSON.stringify(state.categories))}
function loadActiveCats(){try{const s=localStorage.getItem(ACTIVE_CAT_KEY);if(s){const a=JSON.parse(s);if(Array.isArray(a))return a}}catch(e){}return null}
function saveActiveCats(){localStorage.setItem(ACTIVE_CAT_KEY,JSON.stringify(state.activeCategories))}
function getCat(id){return state.categories.find(c=>c.id===id)||{id:'_unknown',name:'未分類',color:'#94a3b8'}}
const EVT_KEY='calendar_events_v1';
function loadSavedEvents(){const s=localStorage.getItem(EVT_KEY);if(s){try{return JSON.parse(s)}catch(e){}}return[]}
function saveEvents(){localStorage.setItem(EVT_KEY,JSON.stringify(state.events))}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function isSameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}
function formatTime(s){return new Date(s).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false})}
function formatDateForInput(dt){const p=n=>n<10?'0'+n:n;return`${dt.getFullYear()}-${p(dt.getMonth()+1)}-${p(dt.getDate())}T${p(dt.getHours())}:${p(dt.getMinutes())}`}
function showToast(msg){const t=document.getElementById('toast');document.getElementById('toastMsg').textContent=msg;t.classList.remove('translate-y-10','opacity-0');clearTimeout(t._tid);t._tid=setTimeout(()=>t.classList.add('translate-y-10','opacity-0'),2400)}
window.showToast=showToast;
function getMonthGridDays(year,month){const first=new Date(year,month,1);const startDay=first.getDay();const dim=new Date(year,month+1,0).getDate();const pd=new Date(year,month,0).getDate();const days=[];for(let i=startDay-1;i>=0;i--)days.push({date:new Date(year,month-1,pd-i),isCurrentMonth:false});for(let i=1;i<=dim;i++)days.push({date:new Date(year,month,i),isCurrentMonth:true});const rem=42-days.length;for(let i=1;i<=rem;i++)days.push({date:new Date(year,month+1,i),isCurrentMonth:false});return days}
function getDaySubText(date){const t=getSolarTerm(date);if(t)return{text:t,type:'term'};const f=getLunarFestival(date);if(f)return{text:f,type:'festival'};const l=getLunarInfo(date);if(l.day)return{text:l.day,type:'lunar'};return{text:'',type:'none'}}
function subTextClass(type,base='text-[9px] leading-tight mt-0.5'){if(type==='festival')return base+' text-rose-500 dark:text-rose-400 font-semibold';return base+' text-ink-400 dark:text-ink-500'}
function hasHolidayEvent(date){return state.events.some(e=>{if(e.category!==HOLIDAY_CAT_ID)return false;return isSameDay(new Date(e.start),date)})}
function parseReminderValue(){const v=parseFloat(document.getElementById('eventReminderValue').value)||0;const u=document.getElementById('eventReminderUnit').value;if(v<=0)return'none';if(u==='day')return String(Math.round(v*1440));if(u==='hour')return String(Math.round(v*60));return String(Math.round(v))}
function fillReminderInputs(reminderValue){const min=parseInt(reminderValue,10)||0;let val=0,unit='min';if(min>0){if(min>=1440&&min%1440===0){val=min/1440;unit='day'}else if(min>=60&&min%60===0){val=min/60;unit='hour'}else{val=min;unit='min'}}else{val=10;unit='min'}document.getElementById('eventReminderValue').value=val;document.getElementById('eventReminderUnit').value=unit}
function openDayDetail(dateStr){const date=new Date(dateStr);state.drawerDate=date;const wd=['日','一','二','三','四','五','六'][date.getDay()];const y=date.getFullYear(),m=date.getMonth()+1,d=date.getDate();document.getElementById('drawerDateTitle').textContent=`${y}年${m}月${d}日 週${wd}`;const lunar=getLunarInfo(date);const sub=getDaySubText(date);let lunarText='';if(sub.type==='term'||sub.type==='festival')lunarText=sub.text;else if(lunar.full)lunarText=lunar.full;document.getElementById('drawerLunarText').textContent=lunarText;const dayEvents=state.events.filter(e=>isSameDay(new Date(e.start),date)).sort((a,b)=>new Date(a.start)-new Date(b.start));document.getElementById('drawerEventCount').textContent=dayEvents.length>0?`${dayEvents.length} 個日程`:'尚無事件';const content=document.getElementById('drawerContent');if(dayEvents.length===0){content.innerHTML=`<div class="flex flex-col items-center justify-center py-10 fade-in"><div class="w-24 h-24 mb-5"><svg viewBox="0 0 100 100" fill="none" class="w-full h-full"><path d="M35 20 L35 50 L10 50 L10 80 L90 80 L90 50 L65 50 L65 20 Z" stroke="currentColor" stroke-width="2" fill="none" class="text-ink-400"/><circle cx="60" cy="25" r="8" fill="none" stroke="currentColor" stroke-width="2" class="text-ink-400"/></svg></div><p class="text-base font-bold text-ink-600 dark:text-ink-300 mb-1">尚無事件</p><p class="text-xs text-ink-400 mb-6">點擊「+」建立</p><button id="drawerEmptyCreateBtn" class="px-8 py-3 bg-gradient-to-tr from-brand-600 to-fuchsia-500 text-white rounded-2xl text-sm font-bold shadow-glow flex items-center space-x-2"><i data-lucide="plus" class="w-4 h-4"></i><span>建立</span></button></div>`;lucide.createIcons();document.getElementById('drawerEmptyCreateBtn').addEventListener('click',()=>{closeDayDetail();setTimeout(()=>openEventModal(null,date),250)})}else{content.innerHTML=`<div class="space-y-1">${dayEvents.map(evt=>{const cat=getCat(evt.category);const timeStr=evt.allDay?'全天':`${formatTime(evt.start)} - ${formatTime(evt.end)}`;return`<div class="flex items-start gap-3 py-2.5 cursor-pointer rounded-xl hover:bg-ink-50 dark:hover:bg-ink-800/50 transition px-2 -mx-2" data-id="${evt.id}"><div class="w-14 shrink-0 text-xs text-ink-500 dark:text-ink-400 font-medium pt-0.5 text-right">${timeStr}</div><div class="w-1 self-stretch rounded-full shrink-0 mt-1" style="background:${cat.color}"></div><div class="flex-1 min-w-0"><div class="font-bold text-sm text-ink-800 dark:text-ink-100">${escapeHtml(evt.title)}</div>${evt.location?`<div class="text-[10px] text-ink-400 mt-0.5">${escapeHtml(evt.location)}</div>`:''}</div></div>`}).join('')}</div>`;lucide.createIcons();content.querySelectorAll('[data-id]').forEach(el=>{el.addEventListener('click',()=>{const evt=state.events.find(x=>x.id===el.dataset.id);if(evt){closeDayDetail();setTimeout(()=>openEventModal(evt),250)}})})}document.getElementById('dayDrawerOverlay').classList.add('open');document.getElementById('dayDrawerPanel').classList.add('open');const editBtn=document.getElementById('drawerEditIconBtn');if(dayEvents.length===1){editBtn.classList.remove('hidden');editBtn.onclick=()=>{closeDayDetail();setTimeout(()=>openEventModal(dayEvents[0]),250)}}else{editBtn.classList.add('hidden')}}

async function deleteCategory(id){if(state.categories.length<=1){showToast('至少需要保留一個分類');return}const cat=state.categories.find(c=>c.id===id);if(!cat)return;const count=state.events.filter(e=>e.category===id).length;const msg=count>0?`分類「${cat.name}」下有 ${count} 個日程，刪除後將歸入其他分類，確定要刪除嗎？`:`確定要刪除分類「${cat.name}」嗎？`;if(!confirm(msg))return;const remaining=state.categories.filter(c=>c.id!==id);const fallbackId=remaining[0].id;let moved=0;state.events.forEach(e=>{if(e.category===id){e.category=fallbackId;moved++}});if(moved){if(window.currentUser&&typeof window.saveEventToCloud==='function'){for(const e of state.events.filter(e=>e.category===fallbackId)){try{await window.saveEventToCloud(e)}catch(err){}}}else{saveEvents()}}state.categories=remaining;state.activeCategories=state.activeCategories.filter(x=>x!==id);saveCategories();saveActiveCats();renderCategories();renderAll();showToast(moved>0?`分類已刪除，${moved} 個日程已歸入「${remaining[0].name}」`:'分類已刪除')}

function saveCategory(){const nameEl=document.getElementById('newCatName');const name=nameEl.value.trim();if(!name){showToast('請輸入分類名稱');nameEl.focus();return}const dup=state.categories.some(c=>c.name===name&&c.id!==editingCategoryId);if(dup){showToast('已有同名分類');nameEl.focus();return}if(editingCategoryId){const cat=state.categories.find(c=>c.id===editingCategoryId);if(!cat)return;cat.name=name;cat.color=newCatColor;saveCategories();renderCategories();renderAll();closeCategoryModal();showToast('分類已更新')}else{const id='cat_'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);state.categories.push({id,name,color:newCatColor});state.activeCategories.push(id);saveCategories();saveActiveCats();renderCategories();renderAll();closeCategoryModal();showToast('已新增分類')}}
function renderMiniCalendar(){const y=state.miniDate.getFullYear(),m=state.miniDate.getMonth();document.getElementById('miniMonthTitle').textContent=`${y}年 ${m+1}月`;const days=getMonthGridDays(y,m);const today=new Date();const grid=document.getElementById('miniCalendarGrid');grid.innerHTML=days.slice(0,35).map(item=>{const isToday=isSameDay(item.date,today);const isSel=isSameDay(item.date,state.currentDate);let cls='py-1.5 rounded-lg transition text-[11px] cursor-pointer font-medium ';if(isSel)cls+='bg-gradient-to-tr from-brand-600 to-fuchsia-500 text-white font-bold shadow-glow';else if(isToday)cls+='bg-brand-100 dark:bg-brand-900/60 text-brand-700 dark:text-brand-300 font-bold';else if(!item.isCurrentMonth)cls+='text-ink-300 dark:text-ink-600';else cls+='text-ink-700 dark:text-ink-300 hover:bg-ink-100 dark:hover:bg-ink-800';return`<button class="mini-day-btn ${cls}" data-date="${item.date.toISOString()}">${item.date.getDate()}</button>`}).join('');document.querySelectorAll('.mini-day-btn').forEach(btn=>{btn.addEventListener('click',()=>{state.currentDate=new Date(btn.dataset.date);renderAll()})})}

function initMonthSwipe(){const container=document.getElementById('monthSwipeContainer');if(!container)return;const isTouch=('ontouchstart'in window)||navigator.maxTouchPoints>0;if(!isTouch)return;container.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;const t=e.touches[0];state.swipeStartX=t.clientX;state.swipeStartY=t.clientY;state.swipeCurrentX=t.clientX;state.swipeCurrentY=t.clientY;state.swiping=false},{passive:true});container.addEventListener('touchmove',e=>{if(e.touches.length!==1)return;const t=e.touches[0];state.swipeCurrentX=t.clientX;state.swipeCurrentY=t.clientY;const dx=state.swipeCurrentX-state.swipeStartX,dy=state.swipeCurrentY-state.swipeStartY;if(Math.abs(dy)>Math.abs(dx))return;if(Math.abs(dx)>8){state.swiping=true;container.classList.add('dragging')}},{passive:true});container.addEventListener('touchend',()=>{container.classList.remove('dragging');if(!state.swiping){state.swiping=false;return}const dx=state.swipeCurrentX-state.swipeStartX,dy=state.swipeCurrentY-state.swipeStartY;if(Math.abs(dy)>Math.abs(dx)){state.swiping=false;return}if(Math.abs(dx)>=state.swipeThreshold){if(dx<0)goToNextMonth();else goToPrevMonth()}state.swiping=false},{passive:true})}

function formatIcsDate(dateStr, allDay) {
  const d = new Date(dateStr); const pad = n => String(n).padStart(2, '0');
  if (allDay) return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
  return `${d.getUTCFullYear()}${pad(d.getUTCMonth()+1)}${pad(d.getUTCDate())}T${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}${pad(d.getUTCSeconds())}Z`;
}
function generateIcsContent() {
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Local Calendar//ICS Export//ZH-TW','CALSCALE:GREGORIAN'];
  state.events.forEach(evt => {
    lines.push('BEGIN:VEVENT');
    lines.push(`UID:${evt.id || 'evt-'+Date.now()}@local.calendar`);
    lines.push(`DTSTAMP:${formatIcsDate(new Date().toISOString(), false)}`);
    const isAllDay = evt.allDay;
    lines.push(`DTSTART${isAllDay ? ';VALUE=DATE' : ''}:${formatIcsDate(evt.start, isAllDay)}`);
    if (evt.end) lines.push(`DTEND${isAllDay ? ';VALUE=DATE' : ''}:${formatIcsDate(evt.end, isAllDay)}`);
    lines.push(`SUMMARY:${(evt.title||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,')}`);
    if (evt.description) lines.push(`DESCRIPTION:${evt.description.replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,')}`);
    if (evt.location) lines.push(`LOCATION:${evt.location.replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,')}`);
    const cat = getCat(evt.category);
    if (cat && cat.name) lines.push(`CATEGORIES:${cat.name}`);
    lines.push('END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  return lines.join('\r\n');
}
function downloadIcs() {
  const content = generateIcsContent();
  const blob = new Blob([content], { type: 'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `calendar-export-${new Date().toISOString().slice(0,10)}.ics`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}
function parseIcsDate(dateStr, isAllDay) {
  const colonIdx = dateStr.indexOf(':');
  let cleanStr = colonIdx !== -1 ? dateStr.substring(colonIdx+1).trim() : dateStr.trim();
  if (isAllDay || /^\d{8}$/.test(cleanStr)) {
    const y=parseInt(cleanStr.substr(0,4)),m=parseInt(cleanStr.substr(4,2))-1,d=parseInt(cleanStr.substr(6,2));
    return new Date(y,m,d,0,0,0).toISOString();
  }
  if (cleanStr.endsWith('Z')) {
    const y=parseInt(cleanStr.substr(0,4)),mo=parseInt(cleanStr.substr(4,2))-1,d=parseInt(cleanStr.substr(6,2));
    const h=parseInt(cleanStr.substr(9,2)),mi=parseInt(cleanStr.substr(11,2)),s=parseInt(cleanStr.substr(13,2));
    return new Date(Date.UTC(y,mo,d,h,mi,s)).toISOString();
  }
  const y=parseInt(cleanStr.substr(0,4)),mo=parseInt(cleanStr.substr(4,2))-1,d=parseInt(cleanStr.substr(6,2));
  const h=parseInt(cleanStr.substr(9,2)),mi=parseInt(cleanStr.substr(11,2)),s=parseInt(cleanStr.substr(13,2));
  return new Date(y,mo,d,h,mi,s).toISOString();
}
function parseIcsContent(text) {
  const rawLines = text.split(/\r?\n/);
  const lines = [];
  for (let i=0;i<rawLines.length;i++) {
    const line = rawLines[i];
    if ((line.startsWith(' ')||line.startsWith('\t')) && lines.length>0) lines[lines.length-1] += line.substring(1);
    else lines.push(line);
  }
  const events=[]; let ce=null;
  lines.forEach(line=>{
    if (line.startsWith('BEGIN:VEVENT')) ce={};
    else if (line.startsWith('END:VEVENT')) { if(ce){events.push(ce);ce=null;} }
    else if (ce) {
      const ci = line.indexOf(':');
      if (ci!==-1) {
        const kp = line.substring(0,ci), v = line.substring(ci+1).trim();
        const k = kp.split(';')[0].toUpperCase();
        const uv = v.replace(/\\n/g,'\n').replace(/\\,/g,',').replace(/\\;/g,';').replace(/\\\\/g,'\\');
        if (k==='SUMMARY') ce.title = uv;
        else if (k==='DTSTART') { const a = kp.toUpperCase().includes('VALUE=DATE'); ce.start = parseIcsDate(v,a); ce.allDay = a; }
        else if (k==='DTEND') { const a = kp.toUpperCase().includes('VALUE=DATE'); ce.end = parseIcsDate(v,a); }
        else if (k==='DESCRIPTION') ce.description = uv;
        else if (k==='LOCATION') ce.location = uv;
        else if (k==='CATEGORIES') ce.categories = uv;
      }
    }
  });
  return events;
}
function formatIcsPreviewDate(evt) {

  const wd = ['日','一','二','三','四','五','六'][st.getDay()];
  const pad = n => String(n).padStart(2,'0');
  if (evt.allDay) return `${st.getFullYear()}/${pad(st.getMonth()+1)}/${pad(st.getDate())} 週${wd} · 全天`;
  const et = new Date(evt.end);
  return `${st.getFullYear()}/${pad(st.getMonth()+1)}/${pad(st.getDate())} 週${wd} · ${pad(st.getHours())}:${pad(st.getMinutes())}`;
}

window.saveEventToCloud=async function(event){if(!cu)throw new Error("未登入");const ref=doc(db,"events",event.id);await setDoc(ref,{...event,userId:cu.uid})};
window.deleteEventFromCloud=async function(id){if(!cu)throw new Error("未登入");await deleteDoc(doc(db,"events",id))};
function updateLoginUI(user){
const lb=document.getElementById('loginBtn'),ui=document.getElementById('userInfo'),un=document.getElementById('userName'),ua=document.getElementById('userAvatar');
const sa=document.getElementById('sideAvatar'),sp=document.getElementById('sideAvatarPlaceholder'),sn=document.getElementById('sideUserName'),ss=document.getElementById('sideUserSub');
if(user){
if(lb)lb.classList.add('hidden');
if(ui){ui.classList.remove('hidden');ui.classList.add('flex')}
if(un)un.textContent=user.displayName||user.email||'使用者';
if(ua&&user.photoURL)ua.src=user.photoURL;
if(sa&&user.photoURL){sa.src=user.photoURL;sa.classList.remove('hidden');if(sp)sp.classList.add('hidden')}
if(sn)sn.textContent=user.displayName||'使用者';
if(ss)ss.textContent=user.email||''
}else{
if(lb)lb.classList.remove('hidden');
if(ui){ui.classList.add('hidden');ui.classList.remove('flex')}
if(sa)sa.classList.add('hidden');
if(sp)sp.classList.remove('hidden');
if(sn)sn.textContent='本地使用者';
if(ss)ss.textContent='資料僅存於此裝置'
}
}
function updateStorageHint(isL){
const h=document.getElementById('storageHint');
if(!h)return;
if(isL)h.textContent='已登入，資料會自動同步到雲端。任何裝置用同一個帳號登入都能看到相同日程。';
else h.textContent='資料儲存在此瀏覽器本地。點擊右上角「Google 登入」即可跨裝置同步。';
}
updateStorageHint(false);
</script>
