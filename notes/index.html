<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content"><meta name="theme-color" content="#f6f5f1"><title>筆記與日記</title><link rel="stylesheet" href="style.css"></head>
<body><div id="app">
<aside class="sidebar" id="sidebar"><a class="brand calendar-brand" href="https://myh7201.github.io/my-calendar/" aria-label="返回日曆" data-calendar-return><span class="brand-icon" data-icon="back" aria-hidden="true"></span><span>返回日曆<small>日曆筆記</small></span></a><button class="primary new-note" data-action="new"><span>＋</span> 寫一則筆記 <kbd>N</kbd></button><nav id="navigation"></nav><div class="side-bottom"><button data-action="diary-review">日記回顧</button><button data-action="templates">模板</button><button data-action="books">筆記本</button><span class="calendar-return calendar-return-space" aria-hidden="true">‹ 返回日曆</span><button data-action="hub">設定與本機備份</button><button data-action="backup">↗ <span>匯出完整備份</span></button><button data-action="import">↙ <span>匯入備份</span></button><button data-action="settings">☷ <span>閱讀與顯示</span></button><div class="local-label"><i></i> 已儲存本機，依日曆帳號同步</div></div></aside>
<section class="library" id="library"><header class="list-header"><div class="mobile-brand"><button class="icon" data-action="sidebar" aria-label="開啟資料夾">☰</button><a class="mobile-calendar-return" href="https://myh7201.github.io/my-calendar/" aria-label="返回日曆" data-calendar-return><span data-icon="back" aria-hidden="true"></span><span>返回日曆</span></a><button class="icon" data-action="new" aria-label="新增筆記">＋</button></div><div class="list-title-row"><h1 id="view-title">全部筆記</h1><button class="icon batch-toggle" data-action="batch-toggle" aria-label="多選管理" title="多選管理" data-icon="check-square"></button><button class="icon" data-action="sort" id="sort-button" title="依最後編輯排序" aria-label="切換排序">↕</button></div><label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="search" type="search" placeholder="搜尋你的文字…" aria-label="搜尋標題、正文和標籤"><kbd>/</kbd></label><div id="diary-controls" hidden></div><div class="list-summary"><span id="result-count"></span><button id="scope-toggle" data-action="scope">搜尋全部記錄</button></div></header><div id="batch-bar" hidden><div><button data-action="batch-all">全選</button><span id="batch-count"></span><button data-action="batch-toggle">完成</button></div><div><button data-action="batch-move">移動</button><button data-action="batch-export">匯出</button><button data-action="batch-delete">刪除</button></div></div><div id="note-list" class="note-list"></div><button class="mobile-create primary" data-action="new" aria-label="新增筆記">＋</button><div class="mobile-tabs"><button data-action="kind" data-kind="note">筆記</button><button data-action="kind" data-kind="diary">▣　日記</button></div></section>
<main class="workspace" id="workspace"><div id="welcome" class="welcome"><div class="welcome-mark">✳</div><h2>選擇一篇筆記</h2><p>從清單開啟內容，或新增一篇筆記。</p><button class="primary" data-action="new">＋ 開始記錄</button><span>選一篇筆記，繼續上次的思緒</span></div><div id="document-view" hidden>
<header class="document-header"><div class="doc-left"><button class="icon back" data-action="back" aria-label="返回筆記清單">‹</button><span id="breadcrumb"></span></div><div class="doc-actions"><span id="save-state" role="status" aria-live="polite">已儲存</span><button class="icon" data-action="pin" id="pin-button" title="置頂" aria-label="置頂筆記">☆</button><button class="icon" data-action="focus" title="專注模式" aria-label="切換專注模式">⛶</button><button class="icon" data-action="more" title="更多操作" aria-label="更多操作" aria-expanded="false">⋯</button><button class="done" data-action="back">完成</button></div></header>
<div id="find-bar" hidden><input id="find-text" type="search" placeholder="在這篇筆記中尋找…" aria-label="筆記內搜尋"><span id="find-count"></span><button data-action="find-prev" aria-label="上一個結果">↑</button><button data-action="find-next" aria-label="下一個結果">↓</button><button data-action="find-close" aria-label="關閉筆記內搜尋">×</button></div><div class="document-scroll" id="document-scroll"><article class="paper"><div class="note-kicker" id="note-kicker"></div><textarea id="title" rows="1" placeholder="標題（選填）" aria-label="筆記標題"></textarea><div class="meta-line"><button id="meta-button" data-action="meta" aria-expanded="false"></button><span id="word-count" title="點擊查看統計" data-action="word-stats">0 字</span></div><section id="diary-writer" hidden></section><section class="metadata" id="metadata" hidden><label>資料夾<select id="folder-select"></select></label><label>記錄日期<input id="record-date" type="date"></label><label class="diary-field">心情<select id="mood"><option value="">未設定</option><option>😊 開心</option><option>😌 平靜</option><option>😔 低落</option><option>😴 疲倦</option><option>🥰 感恩</option></select></label><label>標籤<input id="tags" placeholder="用逗號分隔，例如：Java, 考試"></label></section>
<div id="editor" contenteditable="true" role="textbox" aria-label="筆記正文" aria-multiline="true" spellcheck="false" data-placeholder="在這裡寫下第一個想法…"></div><div class="paper-end"><span>· · ·</span></div></article></div>
<footer class="format-bar" id="format-bar" role="toolbar" aria-label="文字格式"><div class="format-group"><button data-action="insert" class="insert-button" aria-label="插入圖片或檔案" aria-expanded="false">＋</button><span class="tool-divider"></span><button data-command="bold" aria-label="粗體" title="粗體 Ctrl+B"><b>B</b></button><button data-command="italic" aria-label="斜體" title="斜體 Ctrl+I"><i>I</i></button><button data-action="paragraph" aria-label="段落樣式" title="段落樣式">正文 ▾</button><button data-command="insertUnorderedList" aria-label="項目清單" title="項目清單">☷</button><button data-action="format" aria-label="更多格式" aria-expanded="false">Aa</button><span class="tool-divider desktop-only"></span><button data-command="undo" aria-label="復原" title="復原 Ctrl+Z">↶</button><button data-command="redo" aria-label="重做" title="重做 Ctrl+Y">↷</button></div><button class="outline-button" data-action="outline">☷ <span>目錄</span></button></footer></div></main>
</div><div id="veil" class="veil" hidden></div><div id="popover" class="popover" hidden></div><dialog id="dialog"><div class="dialog-heading"><h2 id="dialog-title"></h2><button class="icon" data-action="close-dialog" aria-label="關閉">×</button></div><div id="dialog-body"></div></dialog><div class="toast" id="toast" role="status" hidden></div><input id="image-input" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden><input id="attachment-input" type="file" multiple hidden><input id="backup-input" type="file" accept="application/json,.json,.zip,.lbn" hidden><script src="vendor/editor.js"></script><script src="app.js"></script></body></html>
